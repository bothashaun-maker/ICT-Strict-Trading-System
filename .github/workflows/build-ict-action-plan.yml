name: Build ICT Action Plan PDF
on:
  push:
    branches: [main]
    paths:
      - scripts/build_ict_action_plan.py
      - .github/workflows/build-ict-action-plan.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-pdf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install document dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-lato
          python -m pip install 'reportlab>=4.0,<5'
          sudo mkdir -p /mnt/data
          sudo chown "$USER" /mnt/data
      - name: Generate original 13-page PDF
        run: |
          python scripts/build_ict_action_plan.py
          test -s /mnt/data/ICT_Trading_Action_Plan_Edition_I.pdf
          cp /mnt/data/ICT_Trading_Action_Plan_Edition_I.pdf docs/ICT_Trading_Action_Plan_Edition_I.pdf
          file docs/ICT_Trading_Action_Plan_Edition_I.pdf
      - name: Commit generated PDF
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/ICT_Trading_Action_Plan_Edition_I.pdf
          if ! git diff --cached --quiet; then
            git commit -m "docs: publish ICT trading action plan PDF"
            git push origin HEAD:main
          fi
